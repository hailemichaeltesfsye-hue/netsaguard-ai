[project]
name = "netsaguard-ai"
version = "1.0.0"
description = "NetsaGuard AI: A Decentralized, Privacy-Preserving Agentic Content Hub & Multilingual Anti-Censorship Network"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NetsaGuard Core Team", email = "capstone@netsaguard.africa" }
]
dependencies = [
    "langgraph>=0.2.45",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.7",
    "langchain-google-genai>=2.0.4",
    "langsmith>=0.1.143",
    "chromadb>=0.5.18",
    "pydantic>=2.9.2",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.3",
    "sentence-transformers>=3.2.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "memory", "mcp"]
