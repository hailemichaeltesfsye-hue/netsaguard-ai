<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1520" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(0,255,163,0.18)" stroke-width="2" stroke-dasharray="8 6" />
  <!-- Shield outline -->
  <path d="M256 80 L110 148 V270 C110 370 172 440 256 468 C340 440 402 370 402 270 V148 Z" 
        fill="rgba(10,25,35,0.75)" stroke="url(#shieldGrad)" stroke-width="12" filter="url(#glow)" />
  <!-- Core Inner Shield / Africa motif -->
  <path d="M256 140 L160 185 V260 C160 330 200 380 256 405 C312 380 352 330 352 260 V185 Z" 
        fill="url(#shieldGrad)" opacity="0.85" />
  <!-- Center Cyber Node -->
  <circle cx="256" cy="275" r="28" fill="#03050a" stroke="#00FFA3" stroke-width="6" />
  <circle cx="256" cy="275" r="10" fill="#00FFA3" />
</svg>
